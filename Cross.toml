# SPDX-License-Identifier: BUSL-1.1
#
# cross (https://github.com/cross-rs/cross) configuration for
# this workspace's kiosk-browser cross-compile.
#
# The kiosk shell links libgtk-4 + libwebkitgtk-6.0 +
# libjavascriptcoregtk-6.0 at build time (pkg-config discovery)
# and at run time (dynamic linking). Cross-compiling therefore
# requires those `-dev` packages present in the target Debian
# architecture inside the cross-rs container.
#
# ## Base image: debian:trixie
#
# All three per-target images pin `FROM debian:trixie` — the
# same OS + package universe the target devices run — so build-
# time and runtime dynamic-linker see the SAME symbol versions
# and vendor patch level:
#
#   trixie libwebkitgtk-6.0-dev = 2.52.5-1~deb13u1
#   trixie libgtk-4-dev         = 4.18.6+ds-2
#   trixie libjavascriptcoregtk-6.0-dev = 2.52.5-1~deb13u1
#
# Cross-rs's default `ghcr.io/cross-rs/*:main` images resolve to
# Ubuntu 20.04 focal (only 0.2.5 has published images; there is
# no 0.4.x release with a newer base). Focal apt does NOT carry
# libwebkitgtk-6.0-dev at all (packaging only reached
# libwebkitgtk-4.1 there), so `cross build` against the default
# image fails at container pre-build with `E: Unable to locate
# package libwebkitgtk-6.0-dev`. Even if a workaround injected
# GTK4/WebKit6 via a PPA on top of focal, the resulting binary
# would link against `2.52.3-0ubuntu0.24.04.1` (Ubuntu-vendored)
# while the device runtime presents `2.52.5-1~deb13u1` (Debian-
# vendored). Compatible enough to sometimes work; not compatible
# enough to trust.
#
# Pinning to `debian:trixie` eliminates the drift. The per-target
# Dockerfiles under `cross-images/<triple>/` add:
#   - build-essential + pkg-config for the build host
#   - target-arch cross-linker (aarch64-linux-gnu-gcc /
#     arm-linux-gnueabihf-gcc) on cross targets
#   - dpkg multi-arch fence for the target arch
#   - target-arch dev libraries: libgtk-4-dev:<arch> +
#     libwebkitgtk-6.0-dev:<arch> + libjavascriptcoregtk-6.0-dev:<arch>
#   - cargo/pkg-config env vars for cross-linking
#
# cross-rs mounts the host's cargo + rustup dirs into the
# container at runtime; the images intentionally do NOT install
# rustup so the toolchain version is a single source of truth
# on the developer's dev box.
#
# ## Why not stick with cross-rs default images
#
# cross-rs's default images work for the audio-side plugins
# (evo-device-audio) because those plugins only link libasound2
# — a mature C ABI stable across Ubuntu/Debian versions. GTK4 +
# WebKit6 are newer, vendor-patched differently, and lack that
# same-symbol-across-distros property. The kiosk-eng cross-build
# path is therefore the first place in the fleet's build set
# that materially benefits from runtime-parity ABI.

[target.x86_64-unknown-linux-gnu]
dockerfile.file = "cross-images/x86_64-unknown-linux-gnu/Dockerfile"

[target.aarch64-unknown-linux-gnu]
dockerfile.file = "cross-images/aarch64-unknown-linux-gnu/Dockerfile"

[target.armv7-unknown-linux-gnueabihf]
dockerfile.file = "cross-images/armv7-unknown-linux-gnueabihf/Dockerfile"
